[package]
name = "zhizhi-pet"
version = "0.1.0"
description = "之之的离线 Windows 桌面电子宠物"
authors = ["Zhizhi's family"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "zhizhi_pet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.11.3", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"

[dev-dependencies]
tempfile = "3"
